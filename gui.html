<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            background-color: #000;
            margin: 0;
        }
    </style>
  </head>
  <body>
    <canvas id="myCanvas" width="800" height="300"></canvas>
    <script src="points.js"></script>
    <script>
      const canvas = document.getElementById('myCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      let mouseX = -1000;
      let mouseY = -1000;

      var canvasRect = canvas.getBoundingClientRect();
      var updateRect = function() {
          canvasRect = canvas.getBoundingClientRect();
      };
      window.addEventListener('resize', updateRect, {passive: true});
      window.addEventListener('scroll', updateRect, {passive: true});

      canvas.addEventListener('mousemove', function(e) {
          mouseX = e.clientX - canvasRect.left;
          mouseY = e.clientY - canvasRect.top;
      });

      canvas.addEventListener('touchmove', function(e) {
          if (e.touches.length > 0) {
              mouseX = e.touches[0].clientX - canvasRect.left;
              mouseY = e.touches[0].clientY - canvasRect.top;
              e.preventDefault();
          }
      }, {passive: false});
      canvas.addEventListener('touchstart', function(e) {
          if (e.touches.length > 0) {
              mouseX = e.touches[0].clientX - canvasRect.left;
              mouseY = e.touches[0].clientY - canvasRect.top;
          }
      }, {passive: false});
      canvas.addEventListener('touchend', function(e) {
          mouseX = -1000;
          mouseY = -1000;
      });
      canvas.addEventListener('mouseleave', function(e) {
          mouseX = -1000;
          mouseY = -1000;
      });

      class Vector {
          constructor(x, y) {
              this.x = x || 0;
              this.y = y || 0;
          }
          add(v) {
              this.x += v.x;
              this.y += v.y;
              return this;
          }
          sub(v) {
              this.x -= v.x;
              this.y -= v.y;
              return this;
          }
          mult(n) {
              this.x *= n;
              this.y *= n;
              return this;
          }
          magSq() {
              return this.x * this.x + this.y * this.y;
          }
          mag() {
              return Math.sqrt(this.magSq());
          }
          setMag(n) {
              const m = this.mag();
              if (m !== 0) {
                  this.mult(n / m);
              }
              return this;
          }
          limit(max) {
              if (this.magSq() > max * max) {
                  this.setMag(max);
              }
              return this;
          }
          static subInto(v1, v2, target) {
              target.x = v1.x - v2.x;
              target.y = v1.y - v2.y;
              return target;
          }
          static sub(v1, v2) {
              return new Vector(v1.x - v2.x, v1.y - v2.y);
          }
          static random2D() {
              const angle = Math.random() * Math.PI * 2;
              return new Vector(Math.cos(angle), Math.sin(angle));
          }
      }

      class Vehicle {
          constructor(x, y) {
              this.pos = new Vector(Math.random() * width, Math.random() * height);
              this.target = new Vector(x, y);
              this.vel = Vector.random2D();
              this.acc = new Vector();
              this.r = 8;
              this.maxspeed = 10;
              this.maxforce = 1;
              this._arriveDesired = new Vector();
              this._arriveSteer = new Vector();
              this._fleeDesired = new Vector();
              this._fleeSteer = new Vector();
          }
          behaviors(mouse) {
              const arrive = this.arrive(this.target);
              const flee = this.flee(mouse);
              arrive.mult(1);
              flee.mult(5);
              this.applyForce(flee);
              this.applyForce(arrive);
          }
          applyForce(f) {
              this.acc.add(f);
          }
          update() {
              this.pos.add(this.vel);
              this.vel.add(this.acc);
              this.acc.mult(0);
          }
          show() {
              ctx.fillStyle = '#fff';
              ctx.beginPath();
              ctx.arc(this.pos.x, this.pos.y, 4, 0, Math.PI * 2);
              ctx.fill();
          }
          arrive(target) {
              const desired = Vector.subInto(target, this.pos, this._arriveDesired);
              const d = desired.mag();
              let speed = this.maxspeed;
              if (d < 100) {
                  speed = (d / 100) * this.maxspeed;
              }
              desired.setMag(speed);
              const steer = Vector.subInto(desired, this.vel, this._arriveSteer);
              steer.limit(this.maxforce);
              return steer;
          }
          flee(target) {
              const desired = Vector.subInto(target, this.pos, this._fleeDesired);
              const d = desired.mag();
              if (d < 50) {
                  desired.setMag(this.maxspeed);
                  desired.mult(-1);
                  const steer = Vector.subInto(desired, this.vel, this._fleeSteer);
                  steer.limit(this.maxforce);
                  return steer;
              } else {
                  this._fleeSteer.x = 0;
                  this._fleeSteer.y = 0;
                  return this._fleeSteer;
              }
          }
      }


      var vehicles = [];
      for (var i = 0; i < rawPoints.length; i++) {
          vehicles.push(new Vehicle(rawPoints[i].x, rawPoints[i].y));
      }

      window.requestAnimFrame = (function() {
          return window.requestAnimationFrame ||
              window.webkitRequestAnimationFrame ||
              window.mozRequestAnimationFrame ||
              window.oRequestAnimationFrame ||
              window.msRequestAnimationFrame ||
              function(callback) {
                  window.setTimeout(callback, 1000 / 60);
              };
      })();

      var mouse = new Vector(mouseX, mouseY);
      function draw() {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, width, height);

          mouse.x = mouseX;
          mouse.y = mouseY;
          for (var i = 0; i < vehicles.length; i++) {
              var v = vehicles[i];
              v.behaviors(mouse);
              v.update();
              v.show();
          }

          window.requestAnimationFrame(draw);
      }

      draw();
    </script>
  </body>
</html>
