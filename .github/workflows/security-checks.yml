name: Security Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Gitleaks Scan for Hardcoded Credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks automatically scans for API keys, secrets, passwords

      - name: Semgrep Scan for Client-Side Security Controls
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep/rules.yml
